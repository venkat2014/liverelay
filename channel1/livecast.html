<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveCast - Go Live</title>
<style>
:root{--bg:#0b0d10;--panel:#15181c;--border:#262b31;--text:#e9edf1;--muted:#8b939c;--live:#e0243c;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.topbar{width:100%;padding:14px 16px;text-align:center;border-bottom:1px solid var(--border);letter-spacing:2px;font-weight:700;font-size:14px;color:var(--muted);}
.topbar b{color:var(--text);}
.wrap{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;}
video{width:100%;border-radius:10px;background:#000;display:block;aspect-ratio:9/16;object-fit:cover;}
input[type="text"],input[type="password"]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0e1013;color:var(--text);font-size:15px;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
button{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;}
.btn-live{background:var(--live);color:white;}
.btn-live:disabled{background:#3a3f45;color:#8b939c;cursor:not-allowed;}
.btn-stop{background:#2a2e34;color:white;border:1px solid var(--border);}
.btn-share{background:#25d366;color:#04210f;}
.btn-copy{background:#2a2e34;color:white;border:1px solid var(--border);}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
.dot{width:10px;height:10px;border-radius:50%;background:#555;}
.dot.on{background:var(--live);box-shadow:0 0 0 4px rgba(224,36,60,0.2);}
.dot.pulse{animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,36,60,.5);}70%{box-shadow:0 0 0 8px rgba(224,36,60,0);}100%{box-shadow:0 0 0 0 rgba(224,36,60,0);}}
.small{font-size:12px;color:var(--muted);text-align:center;}
</style>
</head>
<body>

  <div class="topbar"><b id="siteNameLabel">LIVECAST</b> &nbsp;· REPORTER</div>

  <div class="wrap">
    <div class="card"><video id="preview" autoplay muted playsinline></video></div>

    <div class="card">
      <label for="titleInput">Title (optional)</label>
      <input type="text" id="titleInput" placeholder="e.g. Live from City Hall">
    </div>

    <div class="card">
      <label for="streamKey">Stream Key</label>
      <input type="password" id="streamKey" placeholder="Paste your stream key here">
      <p class="small">Not saved anywhere. Paste it fresh each time.</p>
    </div>

    <div class="card">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Offline</span>
      </div>
    </div>

    <button class="btn-live" id="goLiveBtn">🔴 GO LIVE</button>
    <button class="btn-stop" id="stopBtn" disabled>STOP LIVE</button>

    <div class="card" id="linkBox" style="display:none;">
      <label>Viewer Link</label>
      <input type="text" id="viewerLink" readonly>
      <div class="row" style="margin-top:10px;">
        <button class="btn-copy" id="copyBtn">Copy</button>
        <button class="btn-share" id="shareBtn" disabled>Share on WhatsApp</button>
      </div>
    </div>

    <p class="small">Chrome browser only · Keep this tab open while live</p>
  </div>

<script>
/* ======================================================
   EDIT HERE ONLY — everything below this box never changes.
   Make a copy of this file per website (livecast1.html, livecast2.html...)
   and change these 4 lines for each one.
====================================================== */
const CONFIG = {
  SITE_NAME: "AYAAN NEWS",              // shown at top of page
  PLATFORM: "twitch",                   // "twitch" or "kick" (kick support added later)
  VIEWER_PAGE: "liveview.html",         // must sit next to this file
  SHARE_TEXT: "🔴 LIVE NOW\nWatch here:\n{LINK}"
};
/* ====================================================== */

let pc = null, whipResourceUrl = null, localStream = null;

const WHIP_URL_BY_PLATFORM = {
  twitch: "https://g.webrtc.live-video.net:4443/v2/offer"
  // kick: "..." // add Kick's WHIP url here when available
};

async function startCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
    document.getElementById("preview").srcObject = localStream;
  } catch (e) { setStatus("Camera blocked. Allow camera access and reload.", false); }
}

async function goLive() {
  const streamKey = document.getElementById("streamKey").value.trim();
  if (!streamKey) return alert("Paste your Stream Key first.");
  if (!localStream) return alert("Camera is not ready yet.");

  setButtons("connecting");
  setStatus("Connecting...", false);

  try {
    pc = new RTCPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIce(pc);

    const whipUrl = WHIP_URL_BY_PLATFORM[CONFIG.PLATFORM];
    const res = await fetch(whipUrl, {
      method: "POST",
      headers: { "Content-Type": "application/sdp", "Authorization": "Bearer " + streamKey },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error("Rejected (" + res.status + ")");

    whipResourceUrl = res.headers.get("Location");
    const answerSdp = await res.text();
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    setStatus("LIVE", true);
    setButtons("live");
    showViewerLink();
  } catch (err) {
    console.error(err);
    setStatus("Could not go live: " + err.message, false);
    setButtons("idle");
    if (pc) { pc.close(); pc = null; }
  }
}

async function stopLive() {
  setButtons("stopping");
  try { if (whipResourceUrl) await fetch(whipResourceUrl, { method: "DELETE" }); }
  catch (e) { console.warn(e); }
  if (pc) { pc.close(); pc = null; }
  whipResourceUrl = null;
  setStatus("Offline", false);
  setButtons("idle");
}

function waitForIce(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") return resolve();
    const t = setTimeout(resolve, 2000);
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(t); resolve(); }
    });
  });
}

function setStatus(text, live) {
  document.getElementById("statusText").textContent = text;
  document.getElementById("statusDot").classList.toggle("on", live);
  document.getElementById("statusDot").classList.toggle("pulse", live);
}

function setButtons(state) {
  const go = document.getElementById("goLiveBtn"), stop = document.getElementById("stopBtn"), share = document.getElementById("shareBtn");
  if (state === "idle") { go.disabled=false; go.textContent="🔴 GO LIVE"; stop.disabled=true; stop.textContent="STOP LIVE"; share.disabled=true; }
  else if (state === "connecting") { go.disabled=true; go.textContent="Connecting..."; stop.disabled=true; share.disabled=true; }
  else if (state === "live") { go.disabled=true; stop.disabled=false; share.disabled=false; }
  else if (state === "stopping") { stop.disabled=true; stop.textContent="Stopping..."; }
}

function buildViewerLink() {
  const base = window.location.href.replace(/[^/]*\.html.*$/i, "");
  const title = encodeURIComponent(document.getElementById("titleInput").value.trim());
  return base + CONFIG.VIEWER_PAGE + (title ? "?title=" + title : "");
}

function showViewerLink() {
  document.getElementById("viewerLink").value = buildViewerLink();
  document.getElementById("linkBox").style.display = "block";
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("siteNameLabel").textContent = CONFIG.SITE_NAME;
  startCamera();
  document.getElementById("goLiveBtn").addEventListener("click", goLive);
  document.getElementById("stopBtn").addEventListener("click", stopLive);
  document.getElementById("copyBtn").addEventListener("click", () => {
    const box = document.getElementById("viewerLink");
    box.select(); navigator.clipboard.writeText(box.value);
  });
  document.getElementById("shareBtn").addEventListener("click", () => {
    const msg = CONFIG.SHARE_TEXT.replace("{LINK}", buildViewerLink());
    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
  });
});
</script>
</body>
</html>
