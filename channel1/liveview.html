<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveCast - Watch Live</title>
<style>
:root{--bg:#0b0d10;--panel:#15181c;--border:#262b31;--text:#e9edf1;--muted:#8b939c;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.topbar{position:relative;width:100%;padding:14px 60px;text-align:center;border-bottom:1px solid var(--border);letter-spacing:2px;font-weight:700;font-size:14px;color:var(--muted);}
.topbar b{color:var(--text);}
.topbar img#siteLogo{position:absolute;top:6px;right:14px;height:32px;width:auto;border-radius:6px;display:none;}
.wrap{width:100%;max-width:1200px;padding:16px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;}
.main-row{display:flex;flex-direction:column;gap:14px;width:100%;}
.player-col{flex:2 1 0;min-width:0;}
.chat-col{flex:1 1 0;min-width:0;}
.viewer-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;display:block;}
.chat-frame{width:100%;height:360px;border:0;border-radius:10px;background:#000;display:block;}

/* Side-by-side layout on wider screens: chat on the right */
@media (min-width:800px){
  .main-row{flex-direction:row;align-items:stretch;}
  .chat-frame{height:100%;min-height:480px;}
}
</style>
</head>
<body>

  <div class="topbar">
    <b id="siteNameLabel">LIVECAST</b> &nbsp;· LIVE NOW
    <img id="siteLogo" alt="logo">
  </div>

  <div class="wrap">
    <p id="liveTitle" style="display:none;text-align:center;font-weight:600;"></p>
    <div class="main-row">
      <div class="player-col card" id="playerBox"></div>
      <div class="chat-col card" id="chatBox"></div>
    </div>
  </div>

<script>
/* ======================================================
   EDIT HERE ONLY — everything below this box never changes.
   Make a copy per website (liveview1.html, liveview2.html...)
   and change these lines to match that copy of livecast.html
====================================================== */
const CONFIG = {
  SITE_NAME: "AYAAN NEWS",
  PLATFORM: "twitch",          // "twitch" or "kick"
  CHANNEL: "venkat2014",       // Twitch channel name (or Kick channel later)
  LOGO_FILE: "logo.png"        // logo file placed next to this page (empty string "" to hide)
};
/* ====================================================== */

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("siteNameLabel").textContent = CONFIG.SITE_NAME;

  if (CONFIG.LOGO_FILE) {
    const logo = document.getElementById("siteLogo");
    logo.src = CONFIG.LOGO_FILE;
    logo.style.display = "block";
  }

  const params = new URLSearchParams(window.location.search);
  const title = params.get("title");
  if (title) {
    document.getElementById("liveTitle").textContent = decodeURIComponent(title);
    document.getElementById("liveTitle").style.display = "block";
  }

  const parent = window.location.hostname || "localhost";
  const playerBox = document.getElementById("playerBox");
  const chatBox = document.getElementById("chatBox");

  if (CONFIG.PLATFORM === "twitch") {
    playerBox.innerHTML = `<iframe class="viewer-frame" src="https://player.twitch.tv/?channel=${CONFIG.CHANNEL}&parent=${parent}&muted=false" allowfullscreen></iframe>`;
    chatBox.innerHTML = `<iframe class="chat-frame" src="https://www.twitch.tv/embed/${CONFIG.CHANNEL}/chat?parent=${parent}"></iframe>`;
  }
  // else if (CONFIG.PLATFORM === "kick") {
  //   ... add Kick embed code here later ...
  // }
});
</script>
</body>
</html>
