<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveCast - Watch Live</title>
<style>
:root{--bg:#0b0d10;--text:#e9edf1;--muted:#8b939c;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;width:100%;height:100%;overflow:hidden;}

/* Player fills the entire viewport from the start */
#stage{position:fixed;inset:0;width:100%;height:100%;background:#000;}
.viewer-frame{width:100%;height:100%;border:0;display:block;}

/* Overlay bar on top of the video (title + logo), doesn't block video controls below it */
.overlay-top{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom, rgba(0,0,0,.65), rgba(0,0,0,0));pointer-events:none;z-index:5;}
.overlay-top b{letter-spacing:2px;font-size:13px;color:var(--text);}
.overlay-top .sub{color:var(--muted);font-size:13px;margin-left:6px;}
#siteLogo{position:absolute;top:8px;right:10px;height:32px;width:auto;max-width:110px;object-fit:contain;border-radius:6px;display:none;pointer-events:none;z-index:6;}

#liveTitle{position:absolute;top:40px;left:0;right:0;text-align:center;font-weight:600;font-size:14px;padding:0 14px;display:none;z-index:5;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8);}

/* Fullscreen / rotate button, floating bottom-right */
#fsBtn{position:absolute;bottom:16px;right:14px;z-index:10;background:rgba(20,22,26,0.75);color:var(--text);border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px);}
#fsBtn:active{background:rgba(20,22,26,0.95);}

@media (max-width:480px){
  .overlay-top b{font-size:12px;}
  #siteLogo{height:26px;max-width:90px;}
  #liveTitle{font-size:13px;top:36px;}
  #fsBtn{padding:9px 12px;font-size:13px;}
}
</style>
</head>
<body>

  <div id="stage">
    <div class="overlay-top">
      <b id="siteNameLabel">LIVECAST</b><span class="sub">&nbsp;· LIVE NOW</span>
    </div>
    <img id="siteLogo" alt="logo">
    <p id="liveTitle"></p>
    <div id="playerBox" style="width:100%;height:100%;"></div>
    <button id="fsBtn">⛶ Fullscreen</button>
  </div>

<script>
/* ======================================================
   EDIT HERE ONLY — everything below this box never changes.
   Make a copy per website (liveview1.html, liveview2.html...)
   and change these lines to match that copy of livecast.html
====================================================== */
const CONFIG = {
  SITE_NAME: "AYAAN NEWS",
  PLATFORM: "twitch",          // "twitch" or "kick"
  CHANNEL: "venkat2014",       // Twitch channel name (or Kick channel later)
  LOGO_FILE: "logo.png"        // logo file placed next to this page (empty string "" to hide)
};
/* ====================================================== */

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("siteNameLabel").textContent = CONFIG.SITE_NAME;

  if (CONFIG.LOGO_FILE) {
    const logo = document.getElementById("siteLogo");
    logo.onload = () => { logo.style.display = "block"; };
    logo.onerror = () => {
      console.warn("Logo failed to load. Check that '" + CONFIG.LOGO_FILE + "' exists next to this HTML file (exact filename, case-sensitive).");
      logo.style.display = "none";
    };
    logo.src = CONFIG.LOGO_FILE;
  }

  const params = new URLSearchParams(window.location.search);
  const title = params.get("title");
  if (title) {
    document.getElementById("liveTitle").textContent = decodeURIComponent(title);
    document.getElementById("liveTitle").style.display = "block";
  }

  const parent = window.location.hostname || "localhost";
  const playerBox = document.getElementById("playerBox");

  if (CONFIG.PLATFORM === "twitch") {
    playerBox.innerHTML = `<iframe class="viewer-frame" src="https://player.twitch.tv/?channel=${CONFIG.CHANNEL}&parent=${parent}&muted=false" allowfullscreen></iframe>`;
  }
  // else if (CONFIG.PLATFORM === "kick") {
  //   ... add Kick embed code here later ...
  // }

  // Fullscreen + orientation lock (must be triggered by a real tap/click — browsers block this on page load)
  const stage = document.getElementById("stage");
  const fsBtn = document.getElementById("fsBtn");

  async function enterFullscreen() {
    try {
      if (stage.requestFullscreen) await stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) await stage.webkitRequestFullscreen();
    } catch (e) { console.warn("Fullscreen request failed:", e); }

    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch (e) {
      // Expected to fail on iOS Safari and some desktop browsers — no action needed.
      console.warn("Orientation lock not available on this browser:", e);
    }
  }

  function exitFullscreen() {
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  }

  fsBtn.addEventListener("click", () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) { exitFullscreen(); fsBtn.textContent = "⛶ Fullscreen"; }
    else { enterFullscreen(); fsBtn.textContent = "✕ Exit"; }
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) fsBtn.textContent = "⛶ Fullscreen";
  });
});
</script>
</body>
</html>
